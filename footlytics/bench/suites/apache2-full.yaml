# Experimental RT-DETRv2 + PitchCalibNet perception and calibration suite.
# Avoids ultralytics and ext/SoccerMaster runtime imports; PitchCalibNet requires trained weights
# before GSR calibration scoring.
name: apache2-full
description: Experimental broadcast suite (RT-DETRv2 people + ball + PitchCalibNet)
tasks:
  - id: gsr-valid-apache2-full
    kind: gsr
    split: valid
    every: 10
    calibrator:
      backend: apache2
      kp_threshold: 0.30
      line_threshold: 0.45
      refine_lines: true
    detector:
      people_detector: rtdetr
      ball_detector: rtdetr
      ball_conf: 0.15
