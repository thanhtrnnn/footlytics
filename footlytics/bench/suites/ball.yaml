# Ball tracking experiments on the six pinned quick clips. Every task runs the whole pipeline
# and records, besides GS-HOTA, the ball numbers: ball_recall / ball_wrong_share (end to end),
# and ball_det_recall / ball_cand_recall (ceilings: a raw candidate within 20 px of the GT ball,
# before and after the calibration + on-pitch filters). The gap between them says where recall
# is lost: detector, filters, or the selector.
#   detector:  settings of the people + ball models (conf, ball_conf, ball_imgsz, max_balls,
#              ball_detector: yolo (default, AGPL) | rtdetr (ours, Apache-2.0, weights/ball-rtdetrv2/best))
#   pipeline:  PipelineConfig overrides (ball_link, ball_link_break_cost, ...)
# Each change of detector settings reloads the models.
name: ball
tasks:
  - id: ball-base
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
  - id: ball-link
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
    pipeline: {ball_link: true}
  - id: ball-link-conf05
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
    detector: {ball_conf: 0.05}
    pipeline: {ball_link: true}
  - id: ball-link-conf05-img2560
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
    detector: {ball_conf: 0.05, ball_imgsz: 2560}
    pipeline: {ball_link: true}
  - id: ball-rtdetr
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
    detector: {ball_detector: rtdetr, ball_conf: 0.05}
  - id: ball-rtdetr-link
    kind: gsr_pipeline
    split: valid
    clips: [SNGS-025, SNGS-028, SNGS-050, SNGS-056, SNGS-081, SNGS-086]
    every: 10
    detector: {ball_detector: rtdetr, ball_conf: 0.05}
    pipeline: {ball_link: true}
