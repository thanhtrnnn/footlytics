# Milestones only: the test split is never used for tuning.
name: milestone
tasks:
  - id: sncalib-test
    kind: sncalib
    split: test
    frames: all
    # SoccerMaster's training games are not published; until they are, the score is reported
    # with leakage "unverified" and is not quoted externally (spec: Leakage).
    leakage_games: []
  - id: gsr-pipeline-test
    kind: gsr_pipeline
    split: test
    clips: all
    every: 10
  - id: gsr-baseline-test
    kind: gsr_rescore
    split: test
    clips: all
    predictions: baseline/SoccerNetGS-test.zip
    tracker: tracklab
  - id: vleague-frozen
    kind: vleague
    split: frozen
    labels: [bench/vleague/labels/labels-A-s1.json]
    relabels: [bench/vleague/labels/labels-A-s2.json]
    # filled in when the labels freeze (plan 4, Task 5); PENDING fails the task on purpose
    frozen_sha256: {bench/vleague/labels/labels-A-s1.json: PENDING}
    every: 10
    gate_px: 25
