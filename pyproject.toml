[project]
name = "footlytics"
version = "0.0.1"
description = "FOOTLYTICS Game-State Engine prototype: match video -> player/ball trajectories -> tactical data"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "supervision>=0.25",
    "typer>=0.12",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
footlytics = "footlytics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footlytics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
