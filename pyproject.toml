[project]
name = "footlytics"
version = "0.2.0"
description = "Football match analytics: video -> Match State (pitch metres) -> analytics"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "matplotlib>=3.9",
    "torch>=2.3",
    "ultralytics>=8.3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "huggingface_hub>=0.24",
    "pyarrow>=17",
    "requests>=2.32",
    "typer>=0.12",
    "scikit-learn>=1.5",
    "lap>=0.5.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
footlytics = "footlytics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footlytics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
